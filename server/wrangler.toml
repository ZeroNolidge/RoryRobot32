# Rory's cloud server - Cloudflare Workers
name = "rory-server"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Claude model for Rory's answers.
RORY_MODEL = "claude-opus-5-5"
# Voice for the backup tts-1 model (tts-1 has no "marin"). Match the app's script.
TTS_FALLBACK_VOICE = "coral"
# His toy friends, so Rory can ask about them and include them in games.
# Only toys - no names, school or other details about your family.
RORY_FRIENDS = "Knight Owl: his favorite stuffed toy, an owl. A giant stuffed shark: he loves pretending it scares Rory, so play along (silly-scared, then friends)."

# Parent portal (https://<your server>/parent) - see README "Parent portal".
# Create the storage once with:   npx.cmd wrangler kv namespace create RORY_PORTAL
# then remove the # from the three lines below and paste in the id it printed.
# [[kv_namespaces]]
# binding = "PORTAL"
# id = "PASTE-THE-ID-HERE"

[observability]
enabled = true
