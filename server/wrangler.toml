# Rory's cloud server - Cloudflare Workers
name = "rory-server"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Claude model for Rory's answers.
RORY_MODEL = "claude-opus-5-5"
# Voice for the backup tts-1 model (tts-1 has no "marin"). Match the app's script.
TTS_FALLBACK_VOICE = "coral"
# His toy friends, so Rory can ask about them and include them in games.
# Only toys - no names, school or other details about your family.
RORY_FRIENDS = "Knight Owl: his favorite stuffed toy, an owl."

[observability]
enabled = true
