; Rory the Robot - firmware for the Waveshare ESP32-S3-Touch-LCD-1.54
; Build & flash:  cd firmware && pio run -t upload && pio device monitor

[env:rory]
; pioarduino = community PlatformIO platform with Arduino-ESP32 core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 16 MB flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    ; Same versions Waveshare's examples for this board were tested with
    https://github.com/moononournation/Arduino_GFX.git#v1.6.0
    https://github.com/lewisxhe/SensorLib.git#v0.2.6
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.0
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
